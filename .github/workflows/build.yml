name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)' && 'xcode-27' || 'macos-latest' }}
    timeout-minutes: 360

    steps:
      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select Xcode 27.2 and Metal Toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode*.app

          TARGET_XCODE=""
          for candidate in /Applications/Xcode_27.2.app /Applications/Xcode_27.2.0.app /Applications/Xcode_27.2*.app; do
            if [[ -d "$candidate" ]]; then
              TARGET_XCODE="$candidate"
              break
            fi
          done

          if [[ -n "$TARGET_XCODE" ]]; then
            echo "Selecting: $TARGET_XCODE"
            sudo xcode-select -s "$TARGET_XCODE/Contents/Developer"
          fi

          xcodebuild -version

          if ! xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "Metal toolchain missing; downloading..."
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk iphoneos metal --version

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross glslang unar
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 "capstone>=5,<6" fonttools zbic backports.zstd gdown

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_target() {
            local raw_urls="$1"
            local dest_dir="$2"

            if [[ -z "${raw_urls:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            mkdir -p "$dest_dir"

            while IFS= read -r line; do
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              [[ -z "$line" ]] && continue

              if [[ "$line" == *"/folders/"* ]]; then
                echo "Downloading Google Drive folder into $(basename "$dest_dir")..."
                gdown --folder "$line" -O "$dest_dir"
              else
                local file_id
                file_id="$(python - "$line" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in (
              "drive.google.com",
              "www.drive.google.com",
          ):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(
              r"[-A-Za-z0-9_]{20,}", url
          ):
              file_id = url

          if not file_id:
              raise SystemExit(
                  f"Could not extract a Google Drive file ID from: {url}"
              )

          print(file_id)
          PY
          )"
                echo "Downloading file ID $file_id into $(basename "$dest_dir")..."
                (cd "$dest_dir" && gdown "$file_id")
              fi
            done <<< "$(printf '%s\n' "$raw_urls" | tr ', \t\r' '\n')"

            if [[ -z "$(find "$dest_dir" -type f -size +0c -print -quit)" ]]; then
              echo "::error::No downloaded files found in $dest_dir."
              exit 1
            fi

            ls -lh "$dest_dir"
          }

          download_target "$GAME_URL" "$WORK/dl-game"
          download_target "$KEYS_URL" "$WORK/dl-keys"

          KEYS_FILE="$(find "$WORK/dl-keys" -type f -size +0c -print -quit)"
          cp "$KEYS_FILE" "$WORK/prod.keys"
          chmod 600 "$WORK/prod.keys"

          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_target "$UPDATE_URL" "$WORK/dl-update"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi

          if [[ -n "${DLC_URL:-}" ]]; then
            download_target "$DLC_URL" "$WORK/dl-dlc"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi

      - name: Extract archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {".nsp", ".xci", ".nsz", ".xcz"}
          archive_extensions = {".rar", ".zip", ".7z"}
          rar_part_re = re.compile(
              r"(?:[\._\-\s\(]|^)part[\s._-]*0*(\d+)\)?\.rar$",
              re.IGNORECASE,
          )

          def detect_magic(path):
              with path.open("rb") as f:
                  head = f.read(0x104)
              if head[:4] == b"PFS0":
                  return "nsp"
              if head[:4] == b"HEAD" or head[0x100:0x104] == b"HEAD":
                  return "xci"
              if head.startswith((b"Rar!\x1a\x07\x00", b"Rar!\x1a\x07\x01\x00")):
                  return "rar"
              if head[:4] == b"PK\x03\x04":
                  return "zip"
              if head[:6] == b"7z\xbc\xaf\x27\x1c":
                  return "7z"
              return None

          def validate_package(path):
              kind = detect_magic(path)
              suffix = path.suffix.lower()
              if suffix in (".nsp", ".nsz") and kind != "nsp":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )
              if suffix in (".xci", ".xcz") and kind != "xci":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

          def add_package(source, label):
              target = game_dir / source.name
              if target.exists():
                  target = game_dir / f"{label}_{source.name}"
              if target.exists():
                  raise SystemExit(
                      "Duplicate package filename: " + source.name
                  )
              validate_package(source)
              shutil.copy2(source, target)
              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )

          def extract_with_unar(archive_path, extract_dir, label):
              extract_dir.mkdir(parents=True, exist_ok=True)
              print(f"{label}: extracting {archive_path.name} with unar...")
              subprocess.run(
                  [
                      "unar",
                      "-f",
                      "-o",
                      str(extract_dir),
                      str(archive_path),
                  ],
                  check=True,
              )
              packages = sorted(
                  p for p in extract_dir.rglob("*")
                  if p.is_file()
                  and not p.name.startswith(".")
                  and "__MACOSX" not in p.parts
                  and p.suffix.lower() in package_extensions
              )
              if not packages:
                  raise SystemExit(
                      f"No NSP/XCI/NSZ/XCZ packages found "
                      f"after extracting {archive_path.name}."
                  )
              for pkg in packages:
                  add_package(pkg, label)

          def process_download(label):
              src_dir = work / f"dl-{label}"
              if not src_dir.exists():
                  print(f"No {label} download; skipping.")
                  return

              files = sorted(
                  p for p in src_dir.rglob("*")
                  if p.is_file()
                  and not p.name.startswith(".")
                  and "__MACOSX" not in p.parts
              )
              if not files:
                  print(f"No {label} files found; skipping.")
                  return

              print(f"\n=== Processing {label} ({len(files)} file(s)) ===")
              for f in files:
                  print(f"  - {f.name} ({f.stat().st_size:,} bytes)")

              consumed = set()
              handled = False

              # 1) Multi-part RAR (*.part1.rar, *.part01.rar, *_part1.rar)
              part1_rars = []
              for f in files:
                  m = rar_part_re.search(f.name)
                  if m:
                      if int(m.group(1)) == 1:
                          part1_rars.append(f)
                      consumed.add(f)

              for idx, p1 in enumerate(part1_rars):
                  extract_with_unar(
                      p1, work / f"extracted-{label}-part-{idx}", label
                  )
                  handled = True

              # 2) Byte-split files (*.001/.002 or Switch FAT32 00/01)
              split_heads = [
                  f for f in files
                  if f not in consumed
                  and (re.search(r"\.001$", f.name) or f.name == "00")
              ]
              for idx, first in enumerate(split_heads):
                  if first.name == "00":
                      parts = sorted(
                          (
                              f for f in files
                              if f not in consumed
                              and f.parent == first.parent
                              and re.fullmatch(r"\d{2}", f.name)
                          ),
                          key=lambda p: int(p.name),
                      )
                      base_name = f"{label}.nsp"
                  else:
                      base_prefix = re.sub(r"\.001$", "", first.name)
                      parts = sorted(
                          (
                              f for f in files
                              if f not in consumed
                              and f.parent == first.parent
                              and f.name.startswith(base_prefix + ".")
                              and re.fullmatch(r"\d+", f.suffix.lstrip("."))
                          ),
                          key=lambda p: int(p.suffix.lstrip(".")),
                      )
                      base_name = base_prefix

                  for p in parts:
                      consumed.add(p)

                  merged = work / f"merged-{label}-{idx}-{base_name}"
                  print(
                      f"{label}: merging {len(parts)} split parts "
                      f"into {merged.name}..."
                  )
                  with merged.open("wb") as out:
                      for part in parts:
                          with part.open("rb") as inp:
                              shutil.copyfileobj(
                                  inp, out, length=1024 * 1024 * 8
                              )

                  kind = detect_magic(merged)
                  if kind == "nsp":
                      target = (
                          merged
                          if merged.suffix.lower() in (".nsp", ".nsz")
                          else merged.with_suffix(".nsp")
                      )
                      if target != merged:
                          merged.rename(target)
                      add_package(target, label)
                  elif kind == "xci":
                      target = (
                          merged
                          if merged.suffix.lower() in (".xci", ".xcz")
                          else merged.with_suffix(".xci")
                      )
                      if target != merged:
                          merged.rename(target)
                      add_package(target, label)
                  else:
                      extract_with_unar(
                          merged,
                          work / f"extracted-{label}-merged-{idx}",
                          label,
                      )
                  handled = True

              # 3) Standard archives (.rar including .r00 sets, .zip/.z01, .7z)
              for idx, f in enumerate(files):
                  if f in consumed:
                      continue
                  if re.fullmatch(r"\.[rz]\d{2,}", f.suffix.lower()):
                      consumed.add(f)
                      continue
                  kind = detect_magic(f)
                  if (
                      f.suffix.lower() in archive_extensions
                      or kind in ("rar", "zip", "7z")
                  ):
                      consumed.add(f)
                      extract_with_unar(
                          f, work / f"extracted-{label}-arc-{idx}", label
                      )
                      handled = True

              # 4) Direct packages (.nsp, .xci, .nsz, .xcz)
              for f in files:
                  if f in consumed:
                      continue
                  kind = detect_magic(f)
                  if f.suffix.lower() in package_extensions:
                      add_package(f, label)
                      consumed.add(f)
                      handled = True
                  elif kind == "nsp":
                      renamed = f.with_name(f"{label}.nsp")
                      f.rename(renamed)
                      add_package(renamed, label)
                      consumed.add(f)
                      handled = True
                  elif kind == "xci":
                      renamed = f.with_name(f"{label}.xci")
                      f.rename(renamed)
                      add_package(renamed, label)
                      consumed.add(f)
                      handled = True

              if not handled:
                  raise SystemExit(
                      f"Unsupported file format in {label}: "
                      f"{[f.name for f in files]}"
                  )

          process_download("game")
          process_download("update")
          process_download("dlc")

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )

          if not packages:
              raise SystemExit("No game packages were prepared.")

          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

          test -s "$WORK/prod.keys"

      - name: Detect game title ID and select shader profile
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )

                      if count > 100000 or string_size > 100000000:
                          return []

                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)

                      if len(entries) != count * 0x18:
                          return []

                      names = []

                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]

                          if offset >= len(strings):
                              continue

                          end = strings.find(b"\0", offset)

                          if end < 0:
                              continue

                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )

                      return names

              except (OSError, struct.error):
                  return []

          candidates = set()

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      title_id = int(match.group(1), 16)

                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  title_id = int(match.group(1), 16)

                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
          )"

          PROFILE_ID="${PROFILE_OVERRIDE:-$DETECTED_ID}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"

          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi

          echo "Detected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      - name: Update shader toolchain lock and header
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"

          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"

          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "dmsh_chain.py not found; skipping."
            exit 0
          fi

          echo "=== Found $CHAIN_SCRIPT (header) ==="
          head -n 40 "$CHAIN_SCRIPT" || true

          if grep -q -- "--update-lock" "$CHAIN_SCRIPT"; then
            python "$CHAIN_SCRIPT" --update-lock || echo "::warning::--update-lock failed; continuing to IPA build."
          else
            echo "::warning::--update-lock not supported by this version of dmsh_chain.py; skipping."
          fi

          if grep -q -- "--header" "$CHAIN_SCRIPT"; then
            python "$CHAIN_SCRIPT" --header || echo "::warning::--header failed; continuing to IPA build."
          else
            echo "::warning::--header not supported by this version of dmsh_chain.py; skipping."
          fi

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          if grep -q -- "--allow-other-metal" scripts/build_ipa_from_nsp.py; then
            python scripts/build_ipa_from_nsp.py \
              "$GAME_DIR" \
              -k "$WORK/prod.keys" \
              -o "$OUTPUT" \
              --allow-other-metal
          else
            python scripts/build_ipa_from_nsp.py \
              "$GAME_DIR" \
              -k "$WORK/prod.keys" \
              -o "$OUTPUT"
          fi

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
